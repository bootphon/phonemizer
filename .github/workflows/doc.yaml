# build the sphinx documentation and pushes it to a doc branch, then used by github pages.
# On pull requests the documentation is only built, to catch errors and warnings
# before merging.

name: Doc

on:
  push:
    branches: [ master ]

  pull_request:

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  docs:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 4
      matrix:
        python-version: [ 3.12 ]
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip setuptools
          pip install .[doc]
      - name: Build documentation
        run: |
          # fail on warnings (broken references, docstring errors...)
          make --directory=docs html SPHINXOPTS="-W --keep-going"
          touch ./docs/build/html/.nojekyll
      - name: Deploy
        if: github.event_name != 'pull_request'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs/build/html
