[build-system]
requires = ["setuptools >= 61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "phonemizer"
description = "Simple text to phones converter for multiple languages"
authors = [
    {name = "Mathieu Bernard", email = "mathieu.bernard.2@cnrs.fr"},
    {name = "Hadrien Titeux"}]
readme = "README.md"
license = {file = "LICENSE"}
keywords = [
    "linguistics",
    "G2P",
    "phone",
    "espeak",
    "festival",
    "TTS"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: OS Independent"]

requires-python = ">= 3.10"
dynamic = ["version"]
dependencies = [
    "joblib",
    "attrs>=18.1",
    "dlinfo",
    "typing-extensions"]

[project.optional-dependencies]
# the segments backend is optional: it pulls in a heavy dependency chain
# (csvw, rdflib, jsonschema, babel, language-tags) that users of the espeak
# and festival backends do not need. Install with "pip install phonemizer[segments]"
segments = ["segments"]
test = ["pytest>=6.0", "pytest-cov", "coverage[toml]", "segments"]
doc = ["sphinx", "sphinx_rtd_theme", "myst-parser", "segments"]

[project.scripts]
phonemize = "phonemizer.main:main"

[project.urls]
Documentation = "https://bootphon.github.io/phonemizer/"
Repository = "https://github.com/bootphon/phonemizer"
Issues = "https://github.com/bootphon/phonemizer"
Changelog = "https://github.com/bootphon/phonemizer/blob/master/CHANGELOG.md"

[tool.setuptools.packages]
find = {}

[tool.setuptools.package-data]
phonemizer = [
    "share/espeak/*",
    "share/festival/*",
    "share/segments/*"]

[tool.setuptools.dynamic]
version = {attr = "phonemizer.__version__"}

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = "test"
python_files = ["test/*.py"]
filterwarnings = [
     # ignore some deprecation warnings (on regexp escape sequence) for segments
     # module and its dependencies
     "ignore::DeprecationWarning:.*segments.*",
     "ignore::DeprecationWarning:.*csvw.*",
     "ignore::DeprecationWarning:.*clldutils.*",
     # ignore a warning issued by joblib about multithreading
     "ignore:This process (.*) is multi-threaded.*:DeprecationWarning:joblib"]
addopts = "--cov=phonemizer"

[tool.coverage.report]
exclude_lines = [
    "pragma: nocover",
    "@abc.abstractmethod"]
skip_covered = true

# pixi configuration. If you are a pixi user, you can install phonemizer with
# pixi by running `pixi install`, then run tests with `pixi run test` or e.g.
# `pixi run -e py310 test` to run the tests on Python-3.10. Check the code
# with `pixi run lint`.

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-64", "osx-arm64"]
requires-pixi = ">=0.63"

[tool.pixi.pypi-dependencies]
phonemizer = { path = ".", editable = true, extras = ["segments"] }

[tool.pixi.environments]
test = { features = ["test"] }
dev = { features = ["test", "dev"] }
# test the first, the second-to-last, and the last supported version
py310 = ["py310", "test"]
py314 = ["py314", "test"]
py315 = ["py315", "test"]

[tool.pixi.feature.test.pypi-dependencies]
phonemizer = { path = ".", editable = true, extras = ["test", "segments"] }


[tool.pixi.feature.dev.dependencies]
ruff = ">=0.15.5,<0.16"
twine = ">=6.2.0,<7"
ipython = ">=9.11.0,<10"


[tool.pixi.feature.test.tasks]
test = { cmd = "pytest", default-environment = "test" }

[tool.pixi.feature.dev.tasks]
lint = { cmd = "ruff check phonemizer test", default-environment = "dev" }


[tool.pixi.feature.py310.dependencies]
python = "3.10.*"

[tool.pixi.feature.py314.dependencies]
python = "3.14.*"

[tool.pixi.feature.py315.dependencies]
python = "3.15.*"
